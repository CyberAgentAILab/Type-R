[project]
name = "type-r-demo"
version = "0.1.0"
description = "Type-R demo application."
readme = "README.md"
authors = [
    { name = "Wataru Shimoda", email = "wataru_shimoda@cyberagent.co.jp" },
    { name = "Kota Yamaguchi", email = "yamaguchi_kota@cyberagent.co.jp" },
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "sentencepiece>=0.2.1",
    "streamlit>=1.49.1",
    "watchdog>=6.0.0",
    "type-r-app",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["type_r"]  # src layout does not work in editable mode.

[tool.uv.sources]
type-r-app = { path = "../../" }
